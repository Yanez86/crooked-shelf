# Crooked Shelf su Render (render.com), per provarla online gratis.
#   Render › New › Blueprint › scegli questo repository.
#
# Sul piano Free la wiki si spegne dopo 15 minuti senza visite e i dati NON restano:
# a ogni spegnimento, riavvio o nuova versione si riparte da una wiki vuota.
# Per usarla davvero vedi docs/installazione.md.
services:
  - type: web
    name: crooked-shelf
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # Una nuova versione a ogni commit su main.
    autoDeployTrigger: commit
    # Risponde anche prima della configurazione iniziale (con un rimando a /setup).
    healthCheckPath: /login
    envVars:
      # Render fa da proxy HTTPS davanti alla wiki.
      - key: CS_TRUST_PROXY
        value: "1"
      - key: TZ
        value: Europe/Rome
